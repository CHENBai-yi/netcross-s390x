name: Multi-Arch Build & Test CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Static checks run once on amd64. gofmt and vet are architecture
  # independent, so running them in the matrix would only multiply the
  # feedback delay.
  lint:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify dependencies
        # The project has zero third-party dependencies by design, so go.sum
        # does not exist. Check go.mod only, and assert that no module
        # requirements appeared: a dependency creeping in is the thing this
        # step is actually guarding against.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            echo "go.sum appeared; this project is standard-library only"
            git diff --exit-code -- go.sum
          fi
          echo "go.mod: clean, still dependency-free"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

  test:
    name: Test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go test
        run: go test ./... -v -count=1

      - name: go test -race
        run: go test ./... -race -count=1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: s390x
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -v -trimpath -ldflags "-s -w" \
            -o bin/netcross-${{ matrix.goos }}-${{ matrix.goarch }} .
          ls -lh bin/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: netcross-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/netcross-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
